<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D6EEFF"/>
      <stop offset="50%" style="stop-color:#F0F7FF"/>
      <stop offset="100%" style="stop-color:#E8F4FD"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5BA3D9"/>
      <stop offset="50%" style="stop-color:#4A8DB7"/>
      <stop offset="100%" style="stop-color:#E88DA0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#89CFF0" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 装飾の丸（水玉模様） -->
  <circle cx="100" cy="80" r="60" fill="#89CFF0" opacity="0.08"/>
  <circle cx="1100" cy="120" r="90" fill="#FFB3BA" opacity="0.08"/>
  <circle cx="200" cy="550" r="70" fill="#C7CEEA" opacity="0.08"/>
  <circle cx="1000" cy="500" r="80" fill="#B5EAD7" opacity="0.08"/>
  <circle cx="600" cy="50" r="40" fill="#FFB3BA" opacity="0.06"/>
  <circle cx="50" cy="350" r="50" fill="#89CFF0" opacity="0.06"/>
  <circle cx="1150" cy="400" r="45" fill="#C7CEEA" opacity="0.06"/>

  <!-- キラキラ -->
  <text x="150" y="150" font-size="28" opacity="0.25" fill="#89CFF0">✦</text>
  <text x="1020" y="200" font-size="22" opacity="0.2" fill="#FFB3BA">✧</text>
  <text x="300" y="520" font-size="24" opacity="0.2" fill="#C7CEEA">✦</text>
  <text x="900" y="560" font-size="20" opacity="0.25" fill="#B5EAD7">✧</text>
  <text x="80" y="450" font-size="18" opacity="0.2" fill="#89CFF0">✦</text>
  <text x="1100" y="300" font-size="26" opacity="0.15" fill="#FFB3BA">✦</text>

  <!-- メインカード -->
  <rect x="120" y="100" width="960" height="430" rx="32" ry="32" fill="white" filter="url(#soft-shadow)" opacity="0.95"/>

  <!-- 天使ちゃんアイコン -->
  <text x="600" y="230" font-size="100" text-anchor="middle" filter="url(#glow)">👼🍼</text>

  <!-- タイトル -->
  <text x="600" y="330" font-family="'M PLUS Rounded 1c', 'Hiragino Maru Gothic Pro', sans-serif"
        font-size="72" font-weight="800" text-anchor="middle" fill="url(#title-grad)">
    ばぶばぶみるく
  </text>

  <!-- サブタイトル -->
  <text x="600" y="400" font-family="'M PLUS Rounded 1c', 'Hiragino Maru Gothic Pro', sans-serif"
        font-size="30" font-weight="700" text-anchor="middle" fill="#7A8EA0">
    Claude Code ぜんぶ解説でち
  </text>

  <!-- タグライン -->
  <rect x="340" y="430" width="520" height="44" rx="22" fill="#D6EEFF"/>
  <text x="600" y="460" font-family="'M PLUS Rounded 1c', 'Hiragino Maru Gothic Pro', sans-serif"
        font-size="20" font-weight="700" text-anchor="middle" fill="#5B7FA3">
    🌟 専門用語ゼロ・省略ゼロ・やさしいガイド 🌟
  </text>
</svg>
